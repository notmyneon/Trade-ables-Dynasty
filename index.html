}</script><script>
'use strict';
const D=JSON.parse(document.getElementById('league-data').textContent), seasons=D.seasons;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n).toLocaleString('en-CA',{minimumFractionDigits:2,maximumFractionDigits:2});
const record=t=>`${t.wins}–${t.losses}–${t.ties}`;
const byTeam=(s,id)=>s.teams.find(t=>t.id===id);
const managers=[...new Set(seasons.flatMap(s=>s.teams.map(t=>t.managerId)))].map(id=>{const history=seasons.flatMap(s=>s.teams.filter(t=>t.managerId===id).map(t=>({...t,year:s.year,label:s.label})));return {id,name:history.at(-1).manager,latest:history.at(-1).name,history,wins:history.reduce((n,t)=>n+t.wins,0),losses:history.reduce((n,t)=>n+t.losses,0),ties:history.reduce((n,t)=>n+t.ties,0),points:history.reduce((n,t)=>n+t.points,0),titles:history.filter(t=>t.finish===1).length,playoffs:history.filter(t=>t.playoffs).length};}).sort((a,b)=>a.name.localeCompare(b.name));
const allMatches=seasons.flatMap(s=>s.matches.map(m=>({...m,year:s.year,label:s.label,ta:byTeam(s,m.a),tb:byTeam(s,m.b)})));
let state={tab:'Overview',year:2025,manager:managers.find(m=>m.latest==="Sam Cassell's Big Balls")?.id||managers[0].id,phase:'regular',week:'all',a:managers[0].id,b:managers[1].id,search:'',sort:null,dir:1};
const tabs=['Overview','Seasons','Managers','Head-to-head','Records'];
function options(items,value){return items.map(([v,l])=>`<option value="${esc(v)}" ${String(v)===String(value)?'selected':''}>${esc(l)}</option>`).join('')}
function select(label,key,items){return `<label>${label}<select data-key="${key}">${options(items,state[key])}</select></label>`}
function seasonSelect(){return select('Season','year',[...seasons].reverse().map(s=>[s.year,s.label]))}
function phaseSelect(){return select('Competition','phase',[['regular','Regular season'],['playoffs','Postseason — all brackets'],['both','Regular season + postseason']])}
function managerSelect(label,key){return select(label,key,managers.map(m=>[m.id,`${m.name} · ${m.latest}`]))}
function stat(n,label){return `<div class="stat"><strong>${n}</strong><span>${label}</span></div>`}
function managerLink(id,name){return `<button class="link" data-manager="${id}">${esc(name)}</button>`}
function table(cols,rows,id){let sorted=[...rows];if(state.sort?.startsWith(id+':')){const key=state.sort.split(':')[1];sorted.sort((a,b)=>{let x=a[key],y=b[key];return state.dir*(typeof x==='number'?x-y:String(x).localeCompare(String(y)));});}return `<div class="table-wrap"><table><thead><tr>${cols.map(c=>`<th><button data-sort="${id}:${c.key}">${esc(c.label)} ${state.sort===id+':'+c.key?(state.dir===1?'↑':'↓'):'↕'}</button></th>`).join('')}</tr></thead><tbody>${sorted.length?sorted.map(r=>`<tr>${cols.map(c=>`<td>${c.render?c.render(r):esc(r[c.key])}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${cols.length}" class="empty">No results for this selection.</td></tr>`}</tbody></table></div>`}
function matchTable(ms,id){return table([{key:'year',label:'Season',render:m=>esc(m.label)},{key:'week',label:'Week'},{key:'bracket',label:'Competition'},{key:'aname',label:'Team',render:m=>managerLink(m.ta.managerId,m.ta.name)},{key:'sa',label:'Points',render:m=>`<span class="score">${fmt(m.sa)}</span>`},{key:'bname',label:'Opponent',render:m=>managerLink(m.tb.managerId,m.tb.name)},{key:'sb',label:'Points',render:m=>`<span class="score">${fmt(m.sb)}</span>`},{key:'margin',label:'Margin',render:m=>fmt(Math.abs(m.sa-m.sb))},{key:'url',label:'Source',render:m=>`<a href="${esc(m.url)}" target="_blank" rel="noopener">Yahoo ↗</a>`}],ms.map(m=>({...m,aname:m.ta.name,bname:m.tb.name,margin:Math.abs(m.sa-m.sb)})),id)}
function relevant(ms){return ms.filter(m=>state.phase==='both'||m.phase===state.phase)}
function overview(){return `<h2>The league, through the years</h2><p class="intro">A six-season record of champions and the managers behind them.</p><div class="grid stats">${stat(seasons.length,'Seasons archived')}${stat(managers.length,'Managers across league history')}${stat(allMatches.length,'Matchups captured')}${stat(allMatches.filter(m=>m.phase==='regular').length,'Regular-season matchups')}</div><div class="grid champs">${[...seasons].reverse().map(s=>{let podium=[...s.teams].sort((a,b)=>a.finish-b.finish);return `<article class="champ"><span class="medal" aria-hidden="true">🏆</span><div class="year">${s.label} CHAMPION</div><h3>${managerLink(podium[0].managerId,podium[0].name)}</h3><small>${esc(podium[0].manager)} · ${record(podium[0])} regular season</small><p>2nd &nbsp; ${esc(podium[1].name)}<br>3rd &nbsp; ${esc(podium[2].name)}</p><button class="link" data-season="${s.year}">Explore season →</button></article>`}).join('')}</div><div class="section"><h3>All-time regular-season standings</h3>${table([{key:'name',label:'Manager / latest team',render:m=>`${managerLink(m.id,m.name)}<div class="muted">${esc(m.latest)}</div>`},{key:'seasons',label:'Seasons'},{key:'titles',label:'Titles'},{key:'playoffs',label:'Playoff appearances'},{key:'wins',label:'Wins'},{key:'losses',label:'Losses'},{key:'ties',label:'Ties'},{key:'pct',label:'Win %',render:m=>(m.pct*100).toFixed(1)+'%'},{key:'points',label:'Points',render:m=>fmt(m.points)}],[...managers].map(m=>({...m,seasons:m.history.length,pct:(m.wins+m.ties/2)/(m.wins+m.losses+m.ties)})).sort((a,b)=>b.wins-a.wins),'alltime')}</div><div class="note">Manager histories follow the account across team-name and team-number changes. Regular-season records are separate from final playoff finishing positions.</div>`}
function seasonView(){const s=seasons.find(s=>s.year===Number(state.year));let ms=relevant(allMatches.filter(m=>m.year===s.year));if(state.week!=='all')ms=ms.filter(m=>m.week===Number(state.week));return `<h2>${s.label} season</h2><p class="intro">${s.teams.length} teams · Yahoo league ${s.leagueId} · Playoffs begin in Week ${s.playoffStart}</p><div class="controls">${seasonSelect()}</div>${table([{key:'finish',label:'Final finish'},{key:'name',label:'Team',render:t=>`<div class="team-name">${managerLink(t.managerId,t.name)}<small>${esc(t.manager)} ${t.finish===1?' · Champion':''}</small></div>`},{key:'wins',label:'Wins'},{key:'losses',label:'Losses'},{key:'ties',label:'Ties'},{key:'pct',label:'Win %',render:t=>(t.pct*100).toFixed(1)+'%'},{key:'points',label:'Regular-season points',render:t=>fmt(t.points)},{key:'playoffs',label:'Playoffs',render:t=>t.playoffs?'<span class="badge">Qualified</span>':'—'}],s.teams.map(t=>({...t,pct:(t.wins+t.ties/2)/(t.wins+t.losses+t.ties)})),'season')}<div class="section"><h3>Weekly matchups</h3><div class="controls">${phaseSelect()}${select('Week','week',[['all','All weeks'],...s.matches.map(m=>m.week).filter((x,i,a)=>a.indexOf(x)===i).map(w=>[w,'Week '+w])])}</div>${matchTable(ms,'weeks')}</div><div class="note">Final finish is Yahoo’s end-of-season ranking. Postseason includes championship and placement games. The tied 2021–22 quarterfinal uses the advancing team recorded by Yahoo for head-to-head results. ${s.year===2021?'Yahoo records Week 1 as 0–0 ties for every matchup; these are retained in the season records.':''}</div>`}
function managerView(){const m=managers.find(m=>m.id===state.manager);let ms=relevant(allMatches.filter(g=>g.ta.managerId===m.id||g.tb.managerId===m.id));const streaks=[];for(const s of seasons){let best=0,run=0;for(const g of s.matches.filter(g=>g.phase==='regular'&&s.teams.some(t=>t.managerId===m.id&&(t.id===g.a||t.id===g.b)))){const t=s.teams.find(t=>t.managerId===m.id);run=g.winner===t.id?run+1:0;best=Math.max(best,run);}streaks.push(best)}return `<h2>${esc(m.name)}’s history</h2><p class="intro">${esc(m.latest)} · ${m.history.length} seasons in the league</p><div class="controls">${managerSelect('Manager','manager')}</div><div class="grid stats">${stat(m.titles,'Championships')}${stat(record(m),'Regular-season record')}${stat(fmt(m.points),'Regular-season fantasy points')}${stat(Math.max(...streaks),'Longest regular-season winning streak')}</div><h3>Team names & season results</h3>${table([{key:'year',label:'Season',render:t=>`<button class="link" data-season="${t.year}">${esc(t.label)}</button>`},{key:'name',label:'Team name'},{key:'finish',label:'Final finish'},{key:'wins',label:'Wins'},{key:'losses',label:'Losses'},{key:'ties',label:'Ties'},{key:'points',label:'Points',render:t=>fmt(t.points)}],[...m.history].reverse(),'history')}<div class="section"><h3>Matchup history</h3><div class="controls">${phaseSelect()}</div>${matchTable(ms,'managergames')}</div><div class="note">Winning streaks reset at the start of each season and are broken by ties. Championship totals use Yahoo’s official final standings.</div>`}
function h2h(){const a=managers.find(m=>m.id===state.a),b=managers.find(m=>m.id===state.b);const ms=relevant(allMatches.filter(m=>[m.ta.managerId,m.tb.managerId].includes(a.id)&&[m.ta.managerId,m.tb.managerId].includes(b.id)&&a.id!==b.id));let aw=0,bw=0,ties=0,ap=0,bp=0;for(const m of ms){let sa=m.ta.managerId===a.id?m.sa:m.sb,sb=m.ta.managerId===b.id?m.sa:m.sb;ap+=sa;bp+=sb;if(m.winner===(m.ta.managerId===a.id?m.a:m.b))aw++;else if(m.winner===(m.ta.managerId===b.id?m.a:m.b))bw++;else ties++;}return `<h2>The rivalry room</h2><p class="intro">Compare two managers across every archived team name.</p><div class="controls">${managerSelect('First manager','a')}${managerSelect('Second manager','b')}${phaseSelect()}</div><div class="panel match-result"><div><h3>${esc(a.name)}</h3><strong>${aw}</strong><p>${fmt(ap)} points</p></div><div class="vs">WINS<br>${ties} ties<br>${ms.length} meetings</div><div><h3>${esc(b.name)}</h3><strong>${bw}</strong><p>${fmt(bp)} points</p></div></div><div class="section">${matchTable(ms,'rivalry')}</div>`}
function recordsView(){const ms=relevant(allMatches).filter(m=>m.sa!==0||m.sb!==0);let performances=ms.flatMap(m=>[{...m,team:m.ta,opponent:m.tb,points:m.sa,against:m.sb},{...m,team:m.tb,opponent:m.ta,points:m.sb,against:m.sa}]);if(state.search){let q=state.search.toLowerCase();performances=performances.filter(m=>`${m.team.name} ${m.team.manager}`.toLowerCase().includes(q));}const cols=[{key:'points',label:'Points',render:p=>`<span class="score">${fmt(p.points)}</span>`},{key:'name',label:'Team',render:p=>managerLink(p.team.managerId,p.team.name)},{key:'year',label:'Season',render:p=>esc(p.label)},{key:'week',label:'Week'},{key:'against',label:'Opponent score',render:p=>fmt(p.against)}];return `<h2>The record book</h2><p class="intro">Highs, lows, close calls, and the biggest winning margins.</p><div class="controls">${phaseSelect()}<label>Filter scoring lists<input data-search value="${esc(state.search)}" placeholder="Team or manager name"></label></div><div class="grid record-grid"><section><h3>Highest team scores · Top 20</h3>${table(cols,performances.map(p=>({...p,name:p.team.name})).sort((a,b)=>b.points-a.points).slice(0,20),'high')}</section><section><h3>Lowest team scores · Bottom 20</h3>${table(cols,performances.map(p=>({...p,name:p.team.name})).sort((a,b)=>a.points-b.points).slice(0,20),'low')}</section></div><div class="section"><h3>Closest matchups · Top 20</h3>${matchTable([...ms].sort((a,b)=>Math.abs(a.sa-a.sb)-Math.abs(b.sa-b.sb)).slice(0,20),'close')}</div><div class="section"><h3>Largest winning margins · Top 20</h3>${matchTable([...ms].sort((a,b)=>Math.abs(b.sa-b.sb)-Math.abs(a.sa-a.sb)).slice(0,20),'blowout')}</div><div class="note">Record lists exclude the all-zero Week 1 of 2021–22. Raw scores are not adjusted for week length or changes to scoring rules. Manager win–loss histories still include those official ties.</div>`}
function render(){document.getElementById('nav').innerHTML=tabs.map(t=>`<button data-tab="${t}" class="${state.tab===t?'active':''}" ${state.tab===t?'aria-current="page"':''}>${t}</button>`).join('');document.getElementById('app').innerHTML=({Overview:overview,Seasons:seasonView,Managers:managerView,'Head-to-head':h2h,Records:recordsView}[state.tab])()+`<footer>Trade’ables Dynasty · Historical Yahoo exports, 2020–21 through 2025–26.<br>Validated: every regular-season team record and point total matches Yahoo’s season standings. Standalone archive; updates require a new export.</footer>`;}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){state.tab=b.dataset.tab;state.sort=null;}else if(b.dataset.manager){state.manager=b.dataset.manager;state.tab='Managers';state.sort=null;}else if(b.dataset.season){state.year=Number(b.dataset.season);state.week='all';state.tab='Seasons';state.sort=null;}else if(b.dataset.sort){if(state.sort===b.dataset.sort)state.dir*=-1;else{state.sort=b.dataset.sort;state.dir=1;}}else return;render();});
document.addEventListener('change',e=>{if(e.target.dataset.key){state[e.target.dataset.key]=e.target.value;if(e.target.dataset.key==='year')state.week='all';state.sort=null;render();}if(e.target.matches('[data-search]')){state.search=e.target.value;render();}});render();
</script></body></html>
